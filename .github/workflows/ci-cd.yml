name: Data Pipeline CI
on:
  [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

  steps:
  # first step is to get the code pushed/pulled
  - name: Checkout code
    uses: actions/checkout@v4
  
  # step 2 - setting up the python environment
  - name: Python setup
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'
  
  # step 3 - setting up the Java environment for Pyspark
  - name: Java setup
    uses: actions/setup-java@v3
    with:
      java-version: '17'

  # step 4 - installing the python packages required for the scripts 
  - name: Install required python packages
    run: python install pyspark delta-spark pytest
  
  # step 5 - verifying the installation of the above python packages
  - name: Test import
    run: python -c "import pyspark; print('pyspark successfully installed.'')"

  # step 6 - check if all Python files have a valid syntax
  - name: Script syntax check
    run: |
      python -m py_compile pipline/*
      python -m py_compile dags/*
      python -m py_compile ingestion/*
      echo "All files compile successfully"